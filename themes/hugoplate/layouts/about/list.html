{{ define "main" }}
  <section class="section-sm reference-about" aria-labelledby="about-title">
    <div class="container">
      <div class="reference-about__intro">
        <h1 id="about-title" class="reference-page__title">{{ .Title }}</h1>
        <div class="content reference-about__content">
          {{ .Content }}
        </div>
      </div>

      {{ with .RegularPages }}
        <div class="reference-about__people" aria-label="Board members">
          {{ range . }}
            {{ partial "components/author-card" . }}
          {{ end }}
        </div>
      {{ end }}
    </div>
  </section>
{{ end }}
