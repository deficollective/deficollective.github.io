<!-- theme switcher -->
{{ $class := .Class }}
{{ if site.Params.theme_switcher }}
  <div class="theme-switcher {{ $class }}">
    <button
      type="button"
      class="theme-switcher-button mr-2 inline-block text-xl"
      aria-label="Toggle color theme"
      data-theme-switcher>
      <i class="z-10 dark:hidden fa-regular fa-sun" aria-hidden="true"></i>
      <i class="z-10 hidden dark:block fa-regular fa-moon" aria-hidden="true"></i>
    </button>
  </div>
{{ end }}
