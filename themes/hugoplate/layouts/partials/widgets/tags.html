{{ if isset site.Taxonomies "tags" }}
  {{ if not (eq (len site.Taxonomies.tags) 0) }}
    <a class="archive-topics-link" href="{{ `tags/` | relLangURL }}">
      Browse all topics
      <span aria-label="{{ printf "%d topics" (len site.Taxonomies.tags) }}"
        >{{ len site.Taxonomies.tags }}</span
      >
    </a>
  {{ end }}
{{ end }}
